<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1450" role="img" aria-label="AI automation and agent orchestration">
  <title>AI and Automation</title>

  <!-- pale background blobs, matching the other skill illustrations -->
  <circle cx="1240" cy="300" r="290" fill="#dfeafb"/>
  <circle cx="360" cy="1150" r="230" fill="#e8f1fc"/>
  <rect x="70" y="430" width="215" height="46" rx="23" fill="#cfe1f8"/>
  <rect x="70" y="510" width="130" height="46" rx="23" fill="#e8f1fc"/>

  <!-- gear -->
  <g fill="#2b8cf0">
    <path d="M980 96h84l14 76 62 26 62-44 60 60-44 62 26 62 76 14v84l-76 14-26 62 44 62-60 60-62-44-62 26-14 76h-84l-14-76-62-26-62 44-60-60 44-62-26-62-76-14v-84l76-14 26-62-44-62 60-60 62 44 62-26z"/>
  </g>
  <circle cx="1022" cy="374" r="92" fill="#ffffff"/>

  <!-- accent plus marks -->
  <g fill="#29c5f6">
    <rect x="120" y="640" width="118" height="38" rx="6"/>
    <rect x="160" y="600" width="38" height="118" rx="6"/>
  </g>
  <g fill="#2b8cf0">
    <rect x="92" y="790" width="80" height="26" rx="5"/>
    <rect x="119" y="763" width="26" height="80" rx="5"/>
  </g>

  <!-- main panel -->
  <rect x="200" y="470" width="1300" height="740" rx="44" fill="#13305e"/>

  <!-- panel title bar -->
  <rect x="264" y="536" width="196" height="34" rx="17" fill="#2b8cf0"/>
  <rect x="492" y="536" width="300" height="34" rx="17" fill="#20477f"/>
  <rect x="824" y="536" width="150" height="34" rx="17" fill="#f0455f"/>
  <g fill="#ffffff">
    <circle cx="1330" cy="553" r="15"/>
    <circle cx="1382" cy="553" r="15"/>
    <circle cx="1434" cy="553" r="15"/>
  </g>

  <!-- left rail: the prompt / task queue -->
  <rect x="264" y="628" width="300" height="500" rx="26" fill="#1c3f74"/>
  <g fill="#ffffff">
    <rect x="304" y="672" width="220" height="26" rx="13"/>
    <rect x="304" y="722" width="160" height="26" rx="13"/>
  </g>
  <rect x="304" y="782" width="220" height="26" rx="13" fill="#f0455f"/>
  <g fill="#5b8cc8">
    <rect x="304" y="832" width="190" height="26" rx="13"/>
    <rect x="304" y="882" width="130" height="26" rx="13"/>
    <rect x="304" y="932" width="205" height="26" rx="13"/>
    <rect x="304" y="982" width="150" height="26" rx="13"/>
    <rect x="304" y="1032" width="180" height="26" rx="13"/>
  </g>

  <!-- agent graph: one orchestrator fanning out to workers, then converging -->
  <g stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M770 878h96"/>
    <path d="M866 878q52 0 52-52v-96q0-52 52-52h74"/>
    <path d="M866 878q52 0 52 52v96q0 52 52 52h74"/>
    <path d="M1178 678q52 0 52 52v96q0 52 52 52h58"/>
    <path d="M1178 1078q52 0 52-52v-96q0-52 52-52h58"/>
  </g>

  <!-- orchestrator node -->
  <rect x="628" y="806" width="146" height="146" rx="40" fill="#2b8cf0"/>
  <g fill="#ffffff">
    <rect x="668" y="852" width="66" height="18" rx="9"/>
    <rect x="668" y="888" width="46" height="18" rx="9"/>
  </g>

  <!-- worker nodes -->
  <rect x="1022" y="608" width="156" height="140" rx="38" fill="#ffffff"/>
  <g fill="#2b8cf0">
    <rect x="1058" y="650" width="84" height="18" rx="9"/>
    <rect x="1058" y="686" width="56" height="18" rx="9"/>
  </g>

  <rect x="1022" y="1008" width="156" height="140" rx="38" fill="#ffffff"/>
  <g fill="#f0455f">
    <rect x="1058" y="1050" width="84" height="18" rx="9"/>
    <rect x="1058" y="1086" width="56" height="18" rx="9"/>
  </g>

  <!-- converged output node -->
  <rect x="1330" y="808" width="140" height="140" rx="38" fill="#f0455f"/>
  <path d="M1366 878l26 26 52-52" stroke="#ffffff" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- code badge, echoing the other cards -->
  <circle cx="1476" cy="1216" r="118" fill="#f0455f"/>
  <path d="M1436 1176l-38 40 38 40M1516 1176l38 40-38 40" stroke="#ffffff" stroke-width="22" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- dotted flourish -->
  <g fill="#f0455f">
    <circle cx="1596" cy="920" r="11"/>
    <circle cx="1596" cy="968" r="11"/>
    <circle cx="1596" cy="1016" r="11"/>
    <circle cx="1644" cy="944" r="11"/>
    <circle cx="1644" cy="992" r="11"/>
  </g>
</svg>
